name: IEEE ClimateChain Pages Manual Fallback

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    if: github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Install pinned Gitleaks scanner
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Require full-history publication security audit
        run: bash scripts/audit-public-history.sh
      - name: Compile ClimateChain provenance contract
        run: npx --yes solc@0.8.24 --abi --bin contracts/NaFTMRVAnchor.sol --output-dir /tmp/naft-solc
      - name: Run regression, impact proof and ClimateChain checks
        run: bash tests/run.sh
      - name: Verify committed generated reports
        run: git diff --exit-code -- reports/evaluation-kpis.json reports/mitou-impact-experiment.json reports/impact-proof.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Stage allowlisted browser-only Pages payload
        run: bash scripts/stage-public-pages.sh
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
