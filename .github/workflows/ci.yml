name: NaFT MRV Compiler CI
on:
  push:
    branches: [main, "staging/ieee-code-snapshot"]
  pull_request:
  public:
permissions:
  contents: read
jobs:
  core-and-security:
    concurrency:
      group: naft-core-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify preserved original IEEE Git ancestry
        if: github.ref == 'refs/heads/main'
        run: git merge-base --is-ancestor c87b534877293133ad92ac398b95936608bfd91b HEAD
      - name: Compile ClimateChain provenance contract
        run: npx --yes solc@0.8.24 --abi --bin contracts/NaFTMRVAnchor.sol --output-dir /tmp/naft-solc
      - name: Check ClimateChain signing tool syntax
        run: |
          node --check tools/climatechain-testnet-deploy/deploy.mjs
          node --check tools/climatechain-testnet-deploy/verify-generated.mjs
          bash -n tools/climatechain-testnet-deploy/deploy-sepolia.sh
          bash -n scripts/verify-live-sepolia.sh
          node --check tests/public-pages-smoke.mjs
          node -e "JSON.parse(require('fs').readFileSync('tools/climatechain-testnet-deploy/package.json','utf8'))"
      - name: Run Core regression, Compiler Corpus, syntax and security checks
        run: bash tests/run.sh
      - name: Archive Gimje offline structural-preflight report
        uses: actions/upload-artifact@v4
        with:
          name: ieee-gimje-structural-preflight
          path: /tmp/naft-ieee-gimje-structure-preflight.json
          if-no-files-found: error
          retention-days: 21
      - name: Archive Gimje field crosswalk candidates (NOT approved)
        uses: actions/upload-artifact@v4
        with:
          name: ieee-gimje-field-crosswalk-candidates
          path: /tmp/naft-ieee-gimje-field-crosswalk.json
          if-no-files-found: error
          retention-days: 21
      - name: Execute ClimateChain contract behavior on local EVM
        run: node tests/climatechain-contract-behavior.test.mjs
      - name: Browser Reviewer, Evidence file, six-route and Compiler role-flow checks
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/naft-http.log 2>&1 &
          server_pid=$!
          chrome="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          cleanup() {
            kill ${chrome_pid:-} ${server_pid:-} 2>/dev/null || true
          }
          trap cleanup EXIT

          server_ready=false
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:4173/naft-app.html >/dev/null; then
              server_ready=true
              break
            fi
            sleep 0.25
          done
          if [ "$server_ready" != true ]; then
            echo "::error::Static HTTP server did not become ready"
            cat /tmp/naft-http.log || true
            exit 1
          fi

          "$chrome" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage             --no-first-run --no-default-browser-check             --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222             --user-data-dir=/tmp/naft-chrome             "http://127.0.0.1:4173/naft-app.html#/reviewer-demo" >/tmp/naft-chrome.log 2>&1 &
          chrome_pid=$!

          cdp_ready=false
          for i in {1..80}; do
            if curl -fsS http://127.0.0.1:9222/json/list >/dev/null; then
              cdp_ready=true
              break
            fi
            if ! kill -0 "$chrome_pid" 2>/dev/null; then
              break
            fi
            sleep 0.25
          done
          if [ "$cdp_ready" != true ]; then
            echo "::error::Chrome DevTools endpoint did not become ready"
            echo "--- Chrome log ---"
            cat /tmp/naft-chrome.log || true
            echo "--- HTTP log ---"
            cat /tmp/naft-http.log || true
            exit 1
          fi

          node tests/browser-reviewer-smoke.mjs
      - name: Verify reproducible Corpus KPI report
        run: git diff --exit-code -- reports/evaluation-kpis.json reports/mitou-impact-experiment.json reports/impact-proof.json
      - name: Check branch whitespace
        shell: bash
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            git diff --check HEAD^ HEAD
          else
            base="$(git merge-base HEAD origin/main)"
            git diff --check "$base"...HEAD
          fi

  publication-history-audit:
    name: publication-history-audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Install pinned Gitleaks scanner
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Scan all reachable Git history and historical sensitive paths
        run: bash scripts/audit-public-history.sh

  deploy-pages:
    name: deploy-pages
    needs: [core-and-security, publication-history-audit]
    if: github.event.repository.private == false && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'public')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Stage allowlisted browser-only Pages payload
        run: bash scripts/stage-public-pages.sh
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  smoke-public-pages-pr:
    name: smoke-public-pages-pr
    needs: core-and-security
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify live public site with real mobile Chrome (including lazy SVG)
        run: node tests/public-pages-smoke.mjs

  smoke-public-pages:
    name: smoke-public-pages
    needs: deploy-pages
    if: ${{ needs.deploy-pages.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify public Pages, live browser rendering and P1/P2 proof links
        env:
          NAFT_BRAND_RELEASE_CHECK: '1'
        run: node tests/public-pages-smoke.mjs
