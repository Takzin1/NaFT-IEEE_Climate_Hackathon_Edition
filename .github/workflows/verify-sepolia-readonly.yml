name: IEEE Sepolia Read-only Verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-sepolia:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout complete integrated Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Reconstruct and validate existing Sepolia P1 to P2 proof
        run: |
          git merge-base --is-ancestor c87b534877293133ad92ac398b95936608bfd91b HEAD
          verified=false
          for rpc in \
            https://sepolia.gateway.tenderly.co \
            https://sepolia.rpc.thirdweb.com \
            https://ethereum-sepolia-rpc.publicnode.com \
            https://rpc.sepolia.org; do
            echo "Trying read-only Sepolia provider: $rpc"
            if CLIMATECHAIN_VERIFY_RPC_URL="$rpc" bash scripts/verify-live-sepolia.sh; then
              verified=true
              break
            fi
          done
          if [ "$verified" != true ]; then
            echo "::error::All public Sepolia providers failed full source-bound verification; no testnet evidence was changed"
            exit 1
          fi
